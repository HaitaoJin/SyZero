name: Docs

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "Directory.Build.props"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  HARBOR_REGISTRY: harbor.syzero.com
  IMAGE_NAME: syzero/syzero-docs
  CONTAINER_NAME: syzero-docs
  CONTAINER_PORT: 8282

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  push-image:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKERHUB_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@v7
        with:
          context: docs
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  deploy-server:
    if: github.ref_name == 'master'
    environment:
      name: docs-production
      url: https://docs.syzero.com
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Deploy docs container
        uses: appleboy/ssh-action@v1
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_DOCKERHUB_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_DOCKERHUB_TOKEN }}
          IMAGE_REF: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          DOCS_CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DOCS_CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: HARBOR_USERNAME,HARBOR_TOKEN,IMAGE_REF,DOCS_CONTAINER_NAME,DOCS_CONTAINER_PORT
          script: |
            set -e
            echo "$HARBOR_TOKEN" | docker login harbor.syzero.com --username "$HARBOR_USERNAME" --password-stdin
            docker pull "$IMAGE_REF"
            docker rm -f "$DOCS_CONTAINER_NAME" >/dev/null 2>&1 || true
            docker run -d \
              -p "$DOCS_CONTAINER_PORT:80" \
              --name "$DOCS_CONTAINER_NAME" \
              --restart=always \
              "$IMAGE_REF"
