# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Pull_Request

on:
  pull_request:
    branches: [ "master", "dev", "workflow_dev" ]

env:
  GB_NUGET_TOKEN: ${{secrets.GB_NUGET_TOKEN}}
  MS_NUGET_TOKEN: ${{secrets.MS_NUGET_TOKEN}}
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ./SyZero.slnx

    - name: Audit dependencies
      shell: bash
      run: |
        audit_output="$(dotnet list ./SyZero.slnx package --vulnerable --include-transitive)"
        echo "$audit_output"
        if grep -q "has the following vulnerable packages" <<< "$audit_output"; then
          echo "Dependency vulnerability gate failed."
          exit 1
        fi

    - name: Build
      run: dotnet build --configuration Release ./SyZero.slnx --no-restore --warnaserror

    - name: Test
      run: dotnet test ./src/SyZero.Tests/SyZero.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr-test-results
        path: |
          **/TestResults/*.trx
          **/TestResults/**/coverage.cobertura.xml
        if-no-files-found: ignore
